name: Codespace 24/7 Keep Alive

on:
  push:
    branches: [ main ] # এই লাইনটি যোগ করার ফলে পুশ করলেই অ্যাকশনটি চালু হয়ে যাবে
  schedule:
    - cron: '15 * * * *' # টপ-আওয়ার ট্রাফিক জ্যাম এড়াতে ১৫ মিনিটে সেট করা হলো
  workflow_dispatch: 

jobs:
  ping-codespace:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Codespace
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODESPACE_NAME: "legendary-robot-p7p74pv59vvxh4vq" 
        run: |
          echo "🔄 Pinging codespace to keep it alive..."
          gh codespace resume --name "$CODESPACE_NAME"
          echo "✅ Codespace is awake and idle timer reset!"
