name: Codespace 24/7 Keep Alive

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

jobs:
  web-ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit Codespace URL
        run: |
          echo "🌐 Pinging Codespace Endpoint..."
          # -L ফ্ল্যাগ যোগ করার ফলে রিডাইরেক্ট হলেও স্ক্রিপ্টটি সফলভাবে রান হবে
          curl -sL -o /dev/null https://legendary-robot-p7p74pv59vvxh4vq.github.dev/
          echo "✅ Wake-up signal sent successfully!"
