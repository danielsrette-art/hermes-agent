name: Codespace 24/7 Keep Alive & Docker Gateway Monitor

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/20 * * * *' # প্রতি ২০ মিনিট পর পর ব্যাকগ্রাউন্ডে রান হবে
  workflow_dispatch: 

jobs:
  manage-codespace:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      codespaces: write

    steps:
      - name: Force Resume Codespace Container
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODESPACE_NAME: "legendary-robot-p7p74pv59vvxh4vq"
        run: |
          echo "🔄 Keeping Docker Container Awake..."
          gh api -X POST /user/codespaces/$CODESPACE_NAME/start || echo "Already running."
          
          echo "🌐 Ping Endpoint..."
          curl -sL -o /dev/null https://github.dev
          echo "✅ Keep-alive loop completed."
