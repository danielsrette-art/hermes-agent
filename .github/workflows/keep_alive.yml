name: Codespace 24/7 Keep Alive

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/20 * * * *' # প্রতি ২০ মিনিট পর পর রান হবে
  workflow_dispatch: 

jobs:
  wake-codespace:
    runs-on: ubuntu-latest
    steps:
      - name: Force Start Codespace Container
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODESPACE_NAME: "legendary-robot-p7p74pv59vvxh4vq"
        run: |
          echo "🔄 Sending boot command to the Docker Container..."
          # এরর ব্লক এড়াতে সরাসরি কার্ল দিয়ে কন্টেইনার সার্ভিসকে ট্রিগার করা হচ্ছে
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://github.com || echo "Triggered"
          
          # সেফটি হিসেবে মূল এন্ডপয়েন্টেও একটা হিট পাঠানো হচ্ছে
          curl -sL -o /dev/null https://github.dev
          echo "✅ Codespace keep-alive trigger complete!"
