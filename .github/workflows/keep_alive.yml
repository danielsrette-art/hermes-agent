name: Codespace 24/7 Keep Alive

on:
  push:
    branches: [ main ] 
  schedule:
    - cron: '15 * * * *' 
  workflow_dispatch: 

jobs:
  ping-codespace:
    runs-on: ubuntu-latest
    
    # এটি গিটহাব অ্যাকশনকে কোডস্পেস ম্যানেজ করার জন্য ফুল পারমিশন দেবে
    permissions:
      contents: write
      codespaces: write

    steps:
      - name: Wake up Codespace
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODESPACE_NAME: "legendary-robot-p7p74pv59vvxh4vq" 
        run: |
          echo "🔄 Pinging codespace to keep it alive..."
          gh codespace resume --name "$CODESPACE_NAME"
          echo "✅ Codespace is awake and idle timer reset!"
